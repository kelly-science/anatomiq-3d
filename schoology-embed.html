<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AnatomIQ · Interactive 3D model</title>
<style>
:root{font:14px system-ui,-apple-system,sans-serif;color-scheme:dark;background:#12202a;color:#eaf5f5}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden}
#activate{appearance:none;display:flex;align-items:center;justify-content:center;position:relative;width:100%;height:100%;min-height:120px;padding:0;background:radial-gradient(ellipse at center,#273d45,#101d27 74%);color:inherit;border:0;cursor:pointer;text-align:center;overflow:hidden}
#activate:focus-visible{outline:4px solid #92e2d7;outline-offset:-5px}
#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
#activate.has-preview #preview{display:block}
#activate.has-preview:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,21,29,.8),transparent 52%);pointer-events:none}
#content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:90%;padding:16px;text-shadow:0 2px 10px #0015}
#activate.has-preview #content{position:absolute;bottom:0;left:0;right:0;max-width:none;gap:6px}
#icon{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:rgba(107,212,196,.9);color:#08292d;box-shadow:0 4px 20px #0006}
#label{font-size:clamp(15px,2vw,20px);font-weight:750}#sub{font-size:12px;color:#d0e5e7}
#fallback{font-size:clamp(36px,7vw,62px);opacity:.7}
#activate.has-preview #fallback{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="activate" type="button" aria-label="Load interactive AnatomIQ 3D model" disabled>
<img id="preview" alt="Static preview of the published AnatomIQ 3D model" decoding="async">
<div id="content">
<span id="fallback" aria-hidden="true">⬡</span>
<span id="icon" aria-hidden="true">
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.4 3 8l9 5.3L21 8l-6-3.6"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/><path d="m8 2 1 2m7 0 1-2"/></svg>
</span>
<span id="label">AnatomIQ · 3D anatomy</span>
<span id="sub">Click to load interactive model</span>
</div>
</button>
<script>
(function(){
'use strict';
const b=document.getElementById('activate'),img=document.getElementById('preview');
const text=document.getElementById('sub');
const hash=window.location.hash;
// A published lesson is the only acceptable target. Never navigate to an arbitrary URL.
const m=/^#lesson=([a-z0-9-]+)\/([a-z0-9_.-]+)\/([a-z0-9-]+)@([a-z0-9._%\/-]+)$/i.exec(hash);
const scene=/^#scene=([a-zA-Z0-9_-]{10,24000})$/.test(hash);
if((!m&&!scene)||(m&&hash.includes('..'))){text.textContent='Invalid lesson link';return;}
let raw='';
if(m){
  let branch;
  try{branch=decodeURIComponent(m[4]);}catch{text.textContent='Invalid lesson branch';return;}
  if(!branch||branch.length>160||!/^[a-z0-9._/-]+$/i.test(branch)||branch.split('/').some(s=>!s||s==='.'||s==='..')){
    text.textContent='Invalid lesson branch';return;
  }
  const ref={owner:m[1],repo:m[2],slug:m[3],branch};
  raw=`https://raw.githubusercontent.com/${encodeURIComponent(ref.owner)}/${encodeURIComponent(ref.repo)}/${ref.branch.split('/').map(encodeURIComponent).join('/')}/lessons/previews/${encodeURIComponent(ref.slug)}.jpg`;
}
const u=new URL('./index.html',window.location.href);
u.hash=hash;
u.searchParams.set('embed','1');
u.searchParams.set('schoologyActive','1');
// The actual student view is not requested until the user activates this button.
b.disabled=false;
b.addEventListener('click',()=>{b.disabled=true;text.textContent='Loading interactive model…';window.location.assign(u.href);},{once:true});
if(raw){
  img.addEventListener('load',()=>b.classList.add('has-preview'),{once:true});
  img.addEventListener('error',()=>{img.removeAttribute('src');},{once:true});
  img.src=raw;
}
})();
</script>
</body>
</html>
